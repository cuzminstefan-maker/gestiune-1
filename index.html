<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestiune Stoc Offline</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; background: #f4f7f6; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; }
        
        .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--accent); border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; vertical-align: middle; }
        th { background: var(--primary); color: white; font-size: 0.8em; }

        /* DIMENSIUNI COLOANE */
        .col-produs { width: 55%; }
        .col-qty { width: 25%; }
        .col-exp { width: 15%; }
        .col-act { width: 5%; text-align: center; }

        .produs-cell { display: flex; align-items: center; gap: 5px; }
        .input-nume { flex-grow: 1; border: none; background: transparent; font-size: 14px; font-weight: 500; outline: none; padding: 4px; }
        
        .qty-group { display: flex; align-items: center; gap: 3px; justify-content: center; }
        .qty-input { width: 42px; text-align: center; border: 1px solid #ccc; padding: 5px; border-radius: 4px; font-weight: bold; }
        .qty-frac { color: var(--accent); border-color: var(--accent); }

        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 0.85em; }
        .btn-undo { background: #7f8c8d; }
        .btn-clear { background: var(--danger); }
        .btn-export { background: var(--success); }
        .btn-add { background: var(--accent); }

        .btn-mini-plus { background: #e1f5fe; color: #0288d1; border: 1px solid #b3e5fc; border-radius: 4px; cursor: pointer; padding: 2px 6px; font-weight: bold; font-size: 1.1em; }
        .btn-mini-plus:hover { background: #b3e5fc; }
        
        .input-date { width: 100%; border: 1px solid #ccc; border-radius: 4px; font-size: 0.75em; padding: 4px; cursor: pointer; }

        tr.expirat { background-color: #ffdce0; }
        tr.atentie { background-color: #fff4d1; }
        .label-sub { font-size: 0.55em; color: #7f8c8d; text-align: center; display: block; margin-top: 2px; }

        @media (max-width: 600px) {
            .col-produs { width: 50%; }
            .col-qty { width: 35%; }
            .col-exp { width: 15%; }
            .col-act { display: none; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>📦 Gestiune Stoc Offline</h2>
        <button id="undoBtn" class="btn btn-undo" onclick="undo()" disabled>↩ Undo</button>
    </div>
    
    <div class="toolbar">
        <button class="btn btn-add" onclick="adaugaProdusNou()">➕ Produs Nou</button>
        <input type="file" id="fileInput" accept=".xlsx, .xls" style="font-size: 0.7em; max-width: 140px;" />
        <button class="btn btn-export" onclick="exportaExcel()">📥 Excel</button>
        <button class="btn btn-clear" onclick="stergeTot()">⚠️ Golire</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Caută produs..." onkeyup="afiseaza()">

    <table>
        <thead>
            <tr>
                <th class="col-produs">Denumire Produs</th>
                <th class="col-qty">Bax / Unit</th>
                <th class="col-exp">Expirare</th>
                <th class="col-act"></th>
            </tr>
        </thead>
        <tbody id="listaCorp"></tbody>
    </table>
</div>

<script>
    const db = new Dexie("GestiuneStocDB");
    db.version(1).stores({
        produse: '++id, nume, impachetare, cantitateInt, cantitateFrac, dataExpirare'
    });

    let ultimaStare = null;

    async function afiseaza() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const toate = await db.produse.toArray();
        const corp = document.getElementById('listaCorp');
        corp.innerHTML = "";
        const azi = new Date();
        const prag = new Date(new Date().setDate(azi.getDate() + 30));

        toate.forEach(p => {
            if (!p.nume.toLowerCase().includes(query)) return;

            const tr = document.createElement('tr');
            if (p.dataExpirare) {
                const dExp = new Date(p.dataExpirare);
                if (dExp < azi) tr.className = "expirat";
                else if (dExp <= prag) tr.className = "atentie";
            }

            tr.innerHTML = `
                <td class="col-produs">
                    <div class="produs-cell">
                        <button class="btn-mini-plus" onclick="duplica(${p.id})" title="Duplică rând">+</button>
                        <input type="text" class="input-nume" value="${p.nume}" onchange="updateDirect(${p.id}, 'nume', this.value)">
                    </div>
                </td>
                <td class="col-qty">
                    <div class="qty-group">
                        <div>
                            <input type="number" class="qty-input" value="${p.cantitateInt}" onchange="coreleaza(${p.id}, this.value, null)">
                            <span class="label-sub">Bax</span>
                        </div>
                        <span style="font-weight:bold; font-size: 0.8em;">/</span>
                        <div>
                            <input type="number" class="qty-input qty-frac" value="${p.cantitateFrac}" onchange="coreleaza(${p.id}, null, this.value)">
                            <span class="label-sub">Unit</span>
                        </div>
                    </div>
                </td>
                <td class="col-exp">
                    <input type="date" class="input-date" value="${p.dataExpirare}" onchange="updateDirect(${p.id}, 'dataExpirare', this.value)">
                </td>
                <td class="col-act">
                    <button onclick="sterge(${p.id})" style="border:none; background:none; cursor:pointer; font-size:1.1em">🗑️</button>
                </td>
            `;
            corp.appendChild(tr);
        });
    }

    async function adaugaProdusNou() {
        await salveazaUndo();
        await db.produse.add({ nume: "Produs nou", impachetare: 1, cantitateInt: 0, cantitateFrac: 0, dataExpirare: "" });
        afiseaza();
    }

    async function duplica(id) {
        await salveazaUndo();
        const p = await db.produse.get(id);
        const {id: unused, ...copie} = p;
        await db.produse.add(copie);
        afiseaza();
    }

    async function coreleaza(id, nInt, nFrac) {
        await salveazaUndo();
        const p = await db.produse.get(id);
        let imp = p.impachetare || 1;
        let cInt = parseInt(nInt !== null ? nInt : p.cantitateInt) || 0;
        let cFrac = parseInt(nFrac !== null ? nFrac : p.cantitateFrac) || 0;

        if (cFrac >= imp) {
            cInt += Math.floor(cFrac / imp);
            cFrac = cFrac % imp;
        } else if (cFrac < 0) {
            let imprumut = Math.abs(Math.floor(cFrac / imp));
            cInt -= imprumut;
            cFrac = (cFrac % imp + imp) % imp;
        }
        await db.produse.update(id, { cantitateInt: cInt, cantitateFrac: cFrac });
        afiseaza();
    }

    async function updateDirect(id, camp, val) {
        await salveazaUndo();
        await db.produse.update(id, { [camp]: val });
        afiseaza();
    }

    async function sterge(id) {
        await salveazaUndo();
        await db.produse.delete(id);
        afiseaza();
    }

    async function stergeTot() {
        if(confirm("Ștergi toată lista definitiv?")) {
            await salveazaUndo();
            await db.produse.clear();
            afiseaza();
        }
    }

    async function salveazaUndo() {
        ultimaStare = await db.produse.toArray();
        document.getElementById('undoBtn').disabled = false;
    }

    async function undo() {
        if (ultimaStare) {
            await db.produse.clear();
            await db.produse.bulkAdd(ultimaStare);
            ultimaStare = null;
            document.getElementById('undoBtn').disabled = true;
            afiseaza();
        }
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            await salveazaUndo();
            for (let item of json) {
                await db.produse.add({
                    nume: item.Produs || item.Nume || "Fără nume",
                    impachetare: parseInt(item.Imp) || 1,
                    cantitateInt: parseInt(item.Intreg) || parseInt(item.Bax) || 0,
                    cantitateFrac: parseInt(item.Fractie) || parseInt(item.Unit) || 0,
                    dataExpirare: item.Expirare || ""
                });
            }
            afiseaza();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    async function exportaExcel() {
        const date = await db.produse.toArray();
        const ws = XLSX.utils.json_to_sheet(date);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stoc");
        XLSX.writeFile(wb, "Stoc_Offline.xlsx");
    }

    afiseaza();
</script>
</body>
</html>
